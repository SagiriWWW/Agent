[project]
name = "agent-mvp"
version = "0.1.0"
description = "MVP agent for rule-library-driven data processing, rule mining, OpenAI tool calling, and evidence chains."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "mlxtend>=0.24.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "Jinja2>=3.1.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

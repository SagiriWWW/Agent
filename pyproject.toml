[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-agent"
version = "0.1.0"
description = "Local-first, auditable Agent platform for aircraft telemetry analysis (canonical package: aircraft_agent)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0,<3",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "mlxtend>=0.24.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "Jinja2>=3.1.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" makes the canonical `aircraft_agent` package importable; "." keeps the
# `agent_mvp` compatibility shim and existing test imports working.
pythonpath = ["src", "."]

[tool.setuptools.package-data]
"aircraft_agent.interface" = ["report_page.css", "report_page.js"]

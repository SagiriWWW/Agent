schema_version: rule_library_v1
dataset_kind: last_avg
language: zh-CN
description: 内置 Demo 使用的结构化遥测规则库。规则条件保持原始字段名，报告展示会映射为中文字段名。
rules:
  - rule_id: R001
    name: 主电池余量偏低
    field: 1_battery_remaining_avg
    operator: <
    value: 70
    severity: high
    tags: [power, battery, threshold]
    rationale: 主电池剩余电量低于阈值时，可能影响后续飞行安全裕度。
    recommendation: 复核电池余量曲线、任务阶段和返航策略，必要时缩短任务或检查电池健康状态。
    confidence: 0.9

  - rule_id: R002
    name: 主电池电压偏低
    field: 1_voltage_battery_avg
    operator: <
    value: 22500
    severity: high
    tags: [power, voltage, threshold]
    rationale: 电压持续低于阈值可能表示负载过高、电池衰减或供电风险。
    recommendation: 检查电池电压曲线、负载变化和同一时段电流表现。
    confidence: 0.9

  - rule_id: R003
    name: 主电池电流偏高
    field: 1_current_battery_avg
    operator: ">"
    value: 1300
    severity: medium
    tags: [power, current, load]
    rationale: 电流偏高通常表示载荷增大或动力系统处于高负荷状态。
    recommendation: 结合速度、姿态和任务阶段检查是否存在持续高负载。
    confidence: 0.86

  - rule_id: R004
    name: Z 轴振动偏高
    field: 241_vibration_z_avg
    operator: ">"
    value: 12
    severity: medium
    tags: [vibration, sensor, structure]
    rationale: Z 轴振动偏高可能与结构振动、安装松动或飞行姿态变化有关。
    recommendation: 复核振动三轴趋势，并与姿态角、速度和任务阶段交叉检查。
    confidence: 0.84

  - rule_id: R005
    name: 气压计温度偏高
    field: 29_temperature_avg
    operator: ">"
    value: 3820
    severity: medium
    tags: [barometer, temperature, environment]
    rationale: 气压计温度偏高可能影响气压高度估计稳定性，也可能反映局部环境变化。
    recommendation: 同时查看绝对气压、气压差和高度相关字段，判断是否为传感器或环境因素。
    confidence: 0.86

  - rule_id: R006
    name: 垂直速度快速下降
    field: 33_vz_avg
    operator: <
    value: -20
    severity: high
    tags: [navigation, vertical_speed, flight_state]
    rationale: 垂直速度快速下降是飞行状态变化的重要信号，需要结合高度变化判断风险。
    recommendation: 复核相对高度、GPS 高度、姿态角和任务阶段，确认是否为正常下降或异常状态。
    confidence: 0.9

  - rule_id: R007
    name: 地速偏低
    field: 168_speed_avg
    operator: <
    value: 0.5
    severity: low
    tags: [navigation, speed, flight_state]
    rationale: 地速偏低可能对应悬停、起降阶段或停滞状态，需结合任务阶段解释。
    recommendation: 将地速与高度、姿态和时间窗口共同查看，避免把正常悬停误判为异常。
    confidence: 0.82
